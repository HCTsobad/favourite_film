<!DOCTYPE html>
<html lang="vi" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Favourite</title>
    <link rel="shortcut icon" href="image/Flash.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .pl {
            width: 6em;
            height: 6em;
        }

        .pl__ring {
            animation: ringA 2s linear infinite;
        }

        .pl__ring--a {
            stroke: #f42f25;
        }

        .pl__ring--b {
            animation-name: ringB;
            stroke: #f49725;
        }

        .pl__ring--c {
            animation-name: ringC;
            stroke: #255ff4;
        }

        .pl__ring--d {
            animation-name: ringD;
            stroke: #f42582;
        }

        /* Animations */
        @keyframes ringA {

            from,
            4% {
                stroke-dasharray: 0 660;
                stroke-width: 20;
                stroke-dashoffset: -330;
            }

            12% {
                stroke-dasharray: 60 600;
                stroke-width: 30;
                stroke-dashoffset: -335;
            }

            32% {
                stroke-dasharray: 60 600;
                stroke-width: 30;
                stroke-dashoffset: -595;
            }

            40%,
            54% {
                stroke-dasharray: 0 660;
                stroke-width: 20;
                stroke-dashoffset: -660;
            }

            62% {
                stroke-dasharray: 60 600;
                stroke-width: 30;
                stroke-dashoffset: -665;
            }

            82% {
                stroke-dasharray: 60 600;
                stroke-width: 30;
                stroke-dashoffset: -925;
            }

            90%,
            to {
                stroke-dasharray: 0 660;
                stroke-width: 20;
                stroke-dashoffset: -990;
            }
        }

        @keyframes ringB {

            from,
            12% {
                stroke-dasharray: 0 220;
                stroke-width: 20;
                stroke-dashoffset: -110;
            }

            20% {
                stroke-dasharray: 20 200;
                stroke-width: 30;
                stroke-dashoffset: -115;
            }

            40% {
                stroke-dasharray: 20 200;
                stroke-width: 30;
                stroke-dashoffset: -195;
            }

            48%,
            62% {
                stroke-dasharray: 0 220;
                stroke-width: 20;
                stroke-dashoffset: -220;
            }

            70% {
                stroke-dasharray: 20 200;
                stroke-width: 30;
                stroke-dashoffset: -225;
            }

            90% {
                stroke-dasharray: 20 200;
                stroke-width: 30;
                stroke-dashoffset: -305;
            }

            98%,
            to {
                stroke-dasharray: 0 220;
                stroke-width: 20;
                stroke-dashoffset: -330;
            }
        }

        @keyframes ringC {
            from {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: 0;
            }

            8% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -5;
            }

            28% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -175;
            }

            36%,
            58% {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: -220;
            }

            66% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -225;
            }

            86% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -395;
            }

            94%,
            to {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: -440;
            }
        }

        @keyframes ringD {

            from,
            8% {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: 0;
            }

            16% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -5;
            }

            36% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -175;
            }

            44%,
            50% {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: -220;
            }

            58% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -225;
            }

            78% {
                stroke-dasharray: 40 400;
                stroke-width: 30;
                stroke-dashoffset: -395;
            }

            86%,
            to {
                stroke-dasharray: 0 440;
                stroke-width: 20;
                stroke-dashoffset: -440;
            }
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* hoặc 100vh nếu muốn chiếm cả màn */
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html" class="logo"><img src="image/banmei.jpg" alt="Zacian logo">Zacian</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="music.html">Music</a>
            <a href="tvshow.html">TV Show</a>
            <a href="anime.html">Anime</a>
            <a href="ranking.html">BXH</a>
        </div>
        <div class="container catalog-search">
            <div class="search-container">
                <input id="searchInput" class="input" type="search" placeholder="Tìm phim, nhạc, anime…"
                    autocomplete="off" aria-label="Tìm trong danh mục" aria-controls="resultContainer"
                    aria-expanded="false" role="combobox">
                <button id="clearSearch" class="clear-search" type="button" aria-label="Xóa từ khóa"
                    hidden>&times;</button>
                <button id="searchButton" class="search-button" type="button" aria-label="Mở tìm kiếm">
                    <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true">
                        <g>
                            <path
                                d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z">
                            </path>
                        </g>
                    </svg>
                </button>
            </div>
            <div id="resultContainer" role="listbox" aria-label="Kết quả tìm kiếm" hidden></div>
        </div>
    </div>


    <!-- Movie Grid -->
    <div class="movie-container">
        <h2>Phim API</h2>
        <div class="movie-grid" id="apiMovieGrid"></div>
    </div>

    <div class="movie-container">
        <h2>Phim JSON</h2>
        <div class="movie-grid" id="jsonMovieGrid"></div>
    </div>


    <script src="js/movie-card.js"></script>
    <script src="js/api-movies.js"></script>
    <script>
        async function loadSelectedMovies(retry = 0) {
            const grid = document.getElementById("apiMovieGrid");

            // hiện spinner trước
            grid.innerHTML = `<div class="loader-container">
        <svg class="pl" width="80" height="80" viewBox="0 0 240 240">
          <circle class="pl__ring pl__ring--a" cx="120" cy="120" r="105" fill="none" stroke="#000" stroke-width="20"></circle>
          <circle class="pl__ring pl__ring--b" cx="120" cy="120" r="35" fill="none" stroke="#000" stroke-width="20"></circle>
          <circle class="pl__ring pl__ring--c" cx="85" cy="120" r="70" fill="none" stroke="#000" stroke-width="20"></circle>
          <circle class="pl__ring pl__ring--d" cx="155" cy="120" r="70" fill="none" stroke="#000" stroke-width="20"></circle>
        </svg>
        <p>Đang tải phim... (thử lại lần ${retry + 1})</p>
            </div>`;

            try {
                const catalogues = await window.MovieApiLoader.loadCatalogues();
                const slugs = catalogues.anime?.slugs || [];
                if (!slugs.length) throw new Error('Danh mục Anime đang trống.');
                const results = await window.MovieApiLoader.loadMovies(slugs, { concurrency: 4 });
                const successMovies = results.filter(result => result.movie).map(result => result.movie);
                successMovies.sort((first, second) => Number(second.year || 0) - Number(first.year || 0));

                if (successMovies.length === 0) {
                    console.warn("Không tải được phim nào, thử lại...");
                    if (retry < 3) { // 👈 Giới hạn số lần retry, ví dụ 3 lần
                        setTimeout(() => loadSelectedMovies(retry + 1), 2000); // đợi 2s rồi thử lại
                    } else {
                        grid.innerHTML = "<p>Lỗi tải dữ liệu phim. Vui lòng thử lại sau.</p>";
                    }
                    return;
                }

                // render ra HTML
                let html = "";
                successMovies.forEach((movie) => {
                    html += `
              <div class="movie-card" data-slug="${movie.slug}" data-year="${movie.year || ''}" data-quality="${movie.quality || 'FULL'}" data-label="${movie.lang || 'Vietsub'}">
                  <img src="${movie.thumb_url}" alt="${movie.name}">
                  <div class="movie-info">
                      <div class="movie-title">${movie.name}</div>
                      <div class="movie-desc">${movie.origin_name || ""}</div>
                      <p>${movie.original_name || ""}</p>
                      <p>Số tập: ${movie.total_episodes || "?"}</p>
                      <p>Thời lượng: ${movie.time || "?"}</p>
                  </div>
              </div>
            `;
                });

                grid.innerHTML = html;

                grid.querySelectorAll(".movie-card").forEach((card, index) => {
                    window.MovieCardRenderer.decorateApi(card, successMovies[index]);
                    card.addEventListener("click", () => {
                        window.location.href = `detail.html?slug=${card.dataset.slug}`;
                    });
                });

            } catch (err) {
                console.error("Lỗi load dữ liệu:", err);
                grid.innerHTML = "<p>Lỗi tải dữ liệu phim.</p>";
            }
        }

        // chạy khi load trang
        loadSelectedMovies();
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
        fetch('data/movies.json')
            .then(res => res.json())
            .then(movies => {
                const grid = document.getElementById('jsonMovieGrid');

                const animeMovies = movies.filter(movie => movie.type === 'anime').reverse();

                animeMovies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.dataset.video = movie.video;
                    card.innerHTML = `
                <img src="${movie.image}" alt="${movie.title}">
                <div class="movie-info">
                  <div class="movie-title">${movie.title}</div>
                  <div class="movie-desc">${movie.desc}</div>
                </div>
            `;
                    window.MovieCardRenderer.decorateLocal(card, movie);
                    card.addEventListener('click', () => {
                        window.location.href = `detail.html?video=${encodeURIComponent(movie.video)}`;
                    });
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Lỗi load API:', err);
                document.getElementById('movieGrid').innerHTML = "<p>Không tải được danh sách phim.</p>";
            });

        let data = [];

        async function loadData() {
            try {
                const response = await fetch('data/movies.json');
                if (!response.ok) throw new Error('Không thể tải dữ liệu JSON');
                data = await response.json();
                console.log('Dữ liệu đã load:', data);
            } catch (error) {
                console.error(error);
            }
        }

        async function init() {
            await loadData();

            const input = document.getElementById('searchInput');
            const resultContainer = document.getElementById('resultContainer');

            input.addEventListener('input', function () {
                const query = this.value.toLowerCase().trim();
                if (!query) {
                    resultContainer.innerHTML = '';
                    return;
                }

                const filtered = data.filter(item => item.title.toLowerCase().includes(query)
                    ||
                    (item.desc && item.desc.toLowerCase().includes(query)));

                if (filtered.length === 0) {
                    resultContainer.innerHTML = '<p>Không tìm thấy kết quả nào.</p>';
                    return;
                }

                const html = filtered.map(item => `
                <div class="result-item">
                    <img src="${item.image}" alt="${item.title}" width="120">
                    <h4>${item.title}</h4>
                </div>
            `).join('');

                resultContainer.innerHTML = html;
                document.querySelectorAll('.result-item').forEach((el, idx) => {
                    el.addEventListener('click', () => {
                        const video = filtered[idx].video;
                        window.location.href = `player.html?video=${encodeURIComponent(video)}`;
                    });
                });
            });
        }

        // Search is initialized by js/search.js so every page behaves consistently.
    </script>
    <div id="footer"></div>
    <script src="js/search.js"></script>
</body>

</html>
